version: '3.8'

services:
  smm-panel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smm_panel_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:////app/data/smm_panel.db
      - USE_MOCK_PROVIDER=true
      - LOG_LEVEL=INFO
    volumes:
      - smm_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  smm_data:
